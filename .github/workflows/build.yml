name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Simplemize.exe
        shell: pwsh
        run: ./build.ps1

      - name: Self-test (sandbox only, nothing on the runner is changed)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./dist/Simplemize.exe -ArgumentList '--selftest', "$PWD/selftest.txt" -Wait -PassThru
          Get-Content ./selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: Simplemize
          path: |
            dist/Simplemize.exe
            selftest.txt
